---
layout: default
---

<article class="photograph">
  <div>
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.publish_date | default: page.last_modified_at | date_to_xmlschema }}">{% if page.type != 'pages' %}
      Last updated on {{ page.publish_date | default: page.last_modified_at | date: "%B %-d, %Y" }}
      {% endif %}
    </time>
  </div>

  <content>
    {{ content }}
  </content>
</article>
