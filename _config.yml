title:               Ryan Law
include:             ['_pages']
exclude:
  - _site
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata
  - _includes/notes_graph.json
# You may need to change the base URL depending on your deploy configuration.
baseurl:             ''

# If you are using a host that cannot resolve URLs that do
# not end with .html (such as Neocities), set this to 'true'.
use_html_extension:  false

# Set to `true` to open non-internal links in new tabs, or
# set to `false` to open non-internal links in current tab.
open_external_links_in_new_tab: true

# Set to `true` to replace tweet URLs with Twitter embeds.
# Note that doing so will negatively the reader's privacy
# as their browser will communicate with Twitter's servers.
embed_tweets: false

permalink:           pretty
relative_permalinks: false

plugins:
  - jekyll-last-modified-at

sass:
  sass_dir:          _sass
  style:            :compressed

collections:
  notes:
    output: true
    permalink: /:slug
  poems:
    output: true
    permalink: /poems/:name
  photos:
    output: true
    permalink: /photos/:name

defaults:
  - scope:
      path: "**/*"
    values:
      layout: "default"
  - scope:
      path: "_notes/**/*.md"
    values:
      layout: "note"
  - scope:
      path: "_poems/**/*.md"
    values:
      layout: "note"
  - scope:
      path: "_photos/**/*.md"
    values:
      layout: "photos"

description: "The personal website of Ryan Law."
url: "https://ryanlaw.me"
canonical_url: "https://ryanlaw.me"

person_schema:
  id: "https://ryanlaw.me/#ryan-law"
  name: "Ryan Law"
  url: "https://ryanlaw.me"
  image: "https://ryanlaw.me/assets/Ryan_Law_headshot.jpg"
  description: "Ryan Law is the Director of Content Marketing at Ahrefs, writer, speaker, and creator of content marketing courses."
  job_title: "Director of Content Marketing"
  same_as:
    - "https://www.linkedin.com/in/thinkingslow/"
    - "https://x.com/thinking_slow"
    - "https://courses.ryanlaw.me/"
    - "https://ashtales.com/"
    - "https://ashtales.com/podcast"
  knows_about:
    - "Content marketing"
    - "SEO"
    - "Writing"
    - "Editing"
    - "Thought leadership"
    - "Public speaking"
  works_for:
    name: "Ahrefs"
    url: "https://ahrefs.com/"
  affiliations:
    - name: "Animalz"
      url: "https://www.animalz.co/"
    - name: "Cobloom"
      url: "https://www.cobloom.com/"
    - name: "The Software Charity"
      url: "https://www.thesoftwarecharity.org/"
  occupations:
    - name: "Content marketer"
      description: "Marketing leader focused on content marketing, SEO, and thought leadership."
    - name: "Writer"
      description: "Author of novels and writer of notes about writing, marketing, and related ideas."
    - name: "Speaker"
      description: "Speaker, workshop leader, and trainer on content marketing, SEO, and AI in marketing."
